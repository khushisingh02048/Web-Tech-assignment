<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Card</title>

<style>
    /* Element selector */
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(#74b9ff, #a29bfe);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    /* Class selector for the card */
    .card {
        background: #fff;
        width: 300px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        text-align: center;
        position: relative; /* Needed for absolute positioning inside */
        transition: transform 0.4s ease;
    }

    /* Hover transform */
    .card:hover {
        transform: translateY(-10px) scale(1.05);
    }

    /* Profile image container */
    .image-container {
        position: relative;
        width: 120px;
        margin: 0 auto;
    }

    /* Profile image styling */
    .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid #0984e3;
        display: block;
    }

    /* ID selector for badge */
    #badge {
        position: absolute;
        bottom: -5px;
        right: -5px;
        background: #00cec9;
        color: white;
        padding: 5px 10px;
        border-radius: 50px;
        font-size: 12px;
        font-weight: bold;
    }

    .name {
        font-size: 22px;
        font-weight: bold;
        margin-top: 15px;
        color: #2d3436;
    }

    .bio {
        font-size: 14px;
        color: #636e72;
        margin: 10px 0 20px 0;
        line-height: 1.5;
    }

    /* Buttons using pseudo-classes */
    .btn {
        display: inline-block;
        background: #0984e3;
        color: white;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.3s ease, transform 0.3s ease;
    }

    .btn:hover {
        background: #74b9ff;
        transform: scale(1.1);
    }

    .btn:active {
        background: #0652DD;
        transform: scale(0.95);
    }

    .btn:focus {
        outline: 3px solid #00cec9;
    }

</style>
</head>
<body>

<div class="card">
    <div class="image-container">
        <img class="profile-img" src="khushi.jpg" alt="Profile Image">
        <div id="badge">PRO</div>
    </div>

    <div class="name">Khushi Singh</div>
    <div class="bio">
        Web Developer • UI Designer  
        Passionate about creating smooth, beautiful, user-friendly interfaces.
    </div>

    <a href="#" class="btn">Follow</a>
</div>

</body>
</html>
